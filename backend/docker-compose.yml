services:
  database:
    image: postgis/postgis:13-master
    volumes:
      - ./data/database:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: "${DB_USER}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      POSTGRES_DB: "${DB_DATABASE}"
    healthcheck:
      test:
        [
          "CMD",
          "pg_isready",
          "--host=localhost",
          "--username=${DB_USER}",
          "--dbname=${DB_DATABASE}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_interval: 5s
      start_period: 30s

  cache:
    image: redis:6
    healthcheck:
      test: ["CMD-SHELL", "[ $$(redis-cli ping) = 'PONG' ]"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_interval: 5s
      start_period: 30s

  directus:
    image: directus/directus:12.0.2
    ports:
      # Host 8056 → container 8055 (feature/v4-guides): keeps local dev off the
      # production Directus port (8055) so the two don't collide.
      - "8056:8055"
    volumes:
      - "${DIRECTUS_UPLOADS_PATH:-/mnt/datadreamer/uploads}:/directus/uploads"
      - "${DIRECTUS_EXTENSIONS_PATH:-/mnt/datadreamer/extensions}:/directus/extensions"
      - "./snapshot.yaml:/directus/snapshot.yaml:ro"
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy
    environment:
      SECRET: "${DIRECTUS_SECRET}"

      DB_CLIENT: "pg"
      DB_HOST: "database"
      DB_PORT: "5432"
      DB_DATABASE: "${DB_DATABASE}"
      DB_USER: "${DB_USER}"
      DB_PASSWORD: "${DB_PASSWORD}"

      CACHE_ENABLED: "true"
      CACHE_AUTO_PURGE: "true"
      CACHE_STORE: "redis"
      REDIS: "redis://cache:6379"

      ADMIN_EMAIL: "${DIRECTUS_ADMIN_EMAIL}"
      ADMIN_PASSWORD: "${DIRECTUS_ADMIN_PASSWORD}"

      PUBLIC_URL: "${DIRECTUS_PUBLIC_URL:-http://localhost:8056}"
      CORS_ENABLED: "true"
      CORS_ORIGIN: "${CORS_ORIGIN:-http://localhost:4321}"

      # Google SSO for Field Guides (v4.1). Set the secret + role/domain in the
      # deployment env (Coolify). Google console redirect URI must be:
      #   ${PUBLIC_URL}/auth/login/google/callback
      AUTH_PROVIDERS: "${AUTH_PROVIDERS:-google}"
      AUTH_GOOGLE_DRIVER: "openid"
      AUTH_GOOGLE_ISSUER_URL: "https://accounts.google.com"
      AUTH_GOOGLE_CLIENT_ID: "${AUTH_GOOGLE_CLIENT_ID}"
      AUTH_GOOGLE_CLIENT_SECRET: "${AUTH_GOOGLE_CLIENT_SECRET}"
      AUTH_GOOGLE_SCOPE: "openid email profile"
      AUTH_GOOGLE_ALLOW_PUBLIC_REGISTRATION: "true"
      AUTH_GOOGLE_DEFAULT_ROLE_ID: "${GUIDE_READER_ROLE_ID}"
      # Where Directus may send the browser after OAuth (the app origin(s)).
      AUTH_GOOGLE_REDIRECT_ALLOW_LIST: "${APP_ORIGIN}"
      # Share the session cookie across subdomains so the app can read it.
      SESSION_COOKIE_DOMAIN: "${SESSION_COOKIE_DOMAIN}"
      SESSION_COOKIE_SAME_SITE: "lax"
      SESSION_COOKIE_SECURE: "true"
