# Orby chat — fully separate from DataDreamer. Postgres is never port-published;
# only orby-api is exposed (put chat.data-dreamer.net in front of it in Coolify).
services:
  orby-api:
    build: .
    restart: unless-stopped
    ports:
      - "${ORBY_PORT:-8100}:8100"
    environment:
      ORBY_ENV: production
      ORBY_DATABASE_URL: postgresql://orby:${ORBY_DB_PASSWORD}@orby-postgres:5432/orby
      ORBY_DIRECTUS_URL: ${ORBY_DIRECTUS_URL}
      ORBY_DIRECTUS_TOKEN: ${ORBY_DIRECTUS_TOKEN}
      ORBY_OLLAMA_URL: ${ORBY_OLLAMA_URL}
      ORBY_OLLAMA_FALLBACK_URL: ${ORBY_OLLAMA_FALLBACK_URL:-}
      ORBY_EMBEDDING_DIM: ${ORBY_EMBEDDING_DIM:-768}
      ORBY_DISCORD_WEBHOOK_URL: ${ORBY_DISCORD_WEBHOOK_URL:-}
      ORBY_HASH_PEPPER: ${ORBY_HASH_PEPPER}
      ORBY_PUBLIC_ORIGIN: ${ORBY_PUBLIC_ORIGIN:-https://chat.data-dreamer.net}
    depends_on:
      orby-postgres:
        condition: service_healthy

  orby-postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: orby
      POSTGRES_PASSWORD: ${ORBY_DB_PASSWORD}
      POSTGRES_DB: orby
    volumes:
      - orby_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orby -d orby"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  orby_pgdata:
